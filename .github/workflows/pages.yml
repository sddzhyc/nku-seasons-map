name: Update campus data and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
concurrency:
  group: campus-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sync OSM with last-good fallback
        run: npm run data:sync -- --with-basemap --allow-stale
      - run: npm test
      - run: npm run build
        env:
          VITE_TIANDITU_KEY: ${{ vars.VITE_TIANDITU_KEY }}
      - run: npm run check:dist
      - name: Preserve latest valid snapshot in Git
        run: |
          git add public/data/species.json public/data/campus.json public/data/phenology.json public/data/species-index.json public/data/site-data.json public/data/locations.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh validated campus snapshots"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
